<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Ordini e Magazzino</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="mb-4 text-center fw-bold text-primary">Nuovo Ordine - Verifica Giacenza</h2>
        
        <div class="card p-4">
            <form id="orderForm">
                <!-- Selezione Magazzino -->
                <div class="mb-3">
                    <label for="warehouseSelect" class="form-label fw-semibold">Seleziona Magazzino</label>
                    <select class="form-select" id="warehouseSelect" required>
                        <option value="" selected disabled>-- Scegli magazzino --</option>
                        <option value="mag1">Magazzino Centrale (Roma)</option>
                        <option value="mag2">Magazzino Nord (Milano)</option>
                        <option value="mag3">Magazzino Sud (Napoli)</option>
                    </select>
                </div>

                <!-- Selezione Prodotto -->
                <div class="mb-3">
                    <label for="productSelect" class="form-label fw-semibold">Seleziona Prodotto</label>
                    <select class="form-select" id="productSelect" required>
                        <option value="" selected disabled>-- Scegli prodotto --</option>
                        <option value="prodA">Trapano Avvitatore Professionale</option>
                        <option value="prodB">Smerigliatrice Angolare</option>
                        <option value="prodC">Kit Utensili Manuali (100 pz)</option>
                    </select>
                </div>

                <!-- Selezione Modello -->
                <div class="mb-3">
                    <label for="modelSelect" class="form-label fw-semibold">Modello / Variante</label>
                    <select class="form-select" id="modelSelect" required>
                        <option value="" selected disabled>-- Prima seleziona un prodotto --</option>
                    </select>
                </div>

                <!-- Indicatore Quantità Disponibile in Tempo Reale -->
                <div class="alert alert-info d-flex justify-content-between align-items-center" role="alert">
                    <div>
                        <strong>Quantità Disponibile:</strong>
                    </div>
                    <span id="stockDisplay" class="badge bg-secondary fs-5">--</span>
                </div>

                <!-- Quantità Ordinata -->
                <div class="mb-4">
                    <label for="orderQuantity" class="form-label fw-semibold">Quantità da Ordinare</label>
                    <input type="number" class="form-control" id="orderQuantity" min="1" value="1" required>
                    <div id="stockWarning" class="form-text text-danger d-none">Attenzione: La quantità richiesta supera la giacenza disponibile!</div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Conferma e Crea Ordine</button>
            </form>
        </div>
    </div>

    <!-- JavaScript per la gestione in tempo reale -->
    <script>
        // Database di esempio delle giacenze: magazzino -> prodotto -> modello -> quantità
        const stockDatabase = {
            "mag1": {
                "prodA": { "Modello 18V": 15, "Modello 20V Pro": 8 },
                "prodB": { "Standard 115mm": 22, "Heavy Duty 125mm": 4 },
                "prodC": { "Valigetta ABS": 50, "Valigetta Metallica": 12 }
            },
            "mag2": {
                "prodA": { "Modello 18V": 3, "Modello 20V Pro": 0 },
                "prodB": { "Standard 115mm": 10, "Heavy Duty 125mm": 14 },
                "prodC": { "Valigetta ABS": 5, "Valigetta Metallica": 30 }
            },
            "mag3": {
                "prodA": { "Modello 18V": 25, "Modello 20V Pro": 19 },
                "prodB": { "Standard 115mm": 8, "Heavy Duty 125mm": 6 },
                "prodC": { "Valigetta ABS": 15, "Valigetta Metallica": 0 }
            }
        };

        const productModels = {
            "prodA": ["Modello 18V", "Modello 20V Pro"],
            "prodB": ["Standard 115mm", "Heavy Duty 125mm"],
            "prodC": ["Valigetta ABS", "Valigetta Metallica"]
        };

        const warehouseSelect = document.getElementById('warehouseSelect');
        const productSelect = document.getElementById('productSelect');
        const modelSelect = document.getElementById('modelSelect');
        const stockDisplay = document.getElementById('stockDisplay');
        const orderQuantity = document.getElementById('orderQuantity');
        const stockWarning = document.getElementById('stockWarning');

        function updateStock() {
            const wh = warehouseSelect.value;
            const prod = productSelect.value;
            const mod = modelSelect.value;

            if (wh && prod && mod) {
                const available = stockDatabase[wh]?.[prod]?.[mod] ?? 0;
                stockDisplay.textContent = available + " unità";
                
                // Colorazione dinamica del badge in base alla disponibilità
                if (available === 0) {
                    stockDisplay.className = "badge bg-danger fs-5";
                } else if (available < 5) {
                    stockDisplay.className = "badge bg-warning text-dark fs-5";
                } else {
                    stockDisplay.className = "badge bg-success fs-5";
                }

                checkQuantityLimit(available);
            } else {
                stockDisplay.textContent = "--";
                stockDisplay.className = "badge bg-secondary fs-5";
                stockWarning.classList.add('d-none');
            }
        }

        function checkQuantityLimit(availableStock) {
            const requested = parseInt(orderQuantity.value) || 0;
            if (requested > availableStock) {
                stockWarning.classList.remove('d-none');
            } else {
                stockWarning.classList.add('d-none');
            }
        }

        productSelect.addEventListener('change', function() {
            const prod = this.value;
            modelSelect.innerHTML = '<option value="" selected disabled>-- Scegli modello --</option>';
            
            if (productModels[prod]) {
                productModels[prod].forEach(model => {
                    const opt = document.createElement('option');
                    opt.value = model;
                    opt.textContent = model;
                    modelSelect.appendChild(opt);
                });
            }
            updateStock();
        });

        warehouseSelect.addEventListener('change', updateStock);
        modelSelect.addEventListener('change', updateStock);
        orderQuantity.addEventListener('input', function() {
            const wh = warehouseSelect.value;
            const prod = productSelect.value;
            const mod = modelSelect.value;
            if (wh && prod && mod) {
                const available = stockDatabase[wh]?.[prod]?.[mod] ?? 0;
                checkQuantityLimit(available);
            }
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Ordine registrato con successo!');
        });
    </script>
</body>
</html>
